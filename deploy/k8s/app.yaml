apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointiko
  labels:
    app.kubernetes.io/name: appointiko
    app.kubernetes.io/part-of: appointiko
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: appointiko
  template:
    metadata:
      labels:
        app.kubernetes.io/name: appointiko
        app.kubernetes.io/part-of: appointiko
    spec:
      containers:
        - name: appointiko
          # Built locally and loaded into kind by deploy/kind-up.sh — never pulled from a registry.
          image: appointiko:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              value: jdbc:postgresql://postgres:5432/appointiko
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef: { name: appointiko-secrets, key: DATABASE_USERNAME }
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: { name: appointiko-secrets, key: DATABASE_PASSWORD }
            - name: KEYCLOAK_PUBLIC_URL
              value: http://localhost:8180
            - name: KEYCLOAK_INTERNAL_URL
              value: http://keycloak:8080
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: appointiko-secrets, key: KEYCLOAK_CLIENT_SECRET }
            - name: STORAGE_ENDPOINT
              value: http://minio:9000
            - name: STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: appointiko-secrets, key: STORAGE_ACCESS_KEY }
            - name: STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: appointiko-secrets, key: STORAGE_SECRET_KEY }
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef: { name: appointiko-secrets, key: RESEND_API_KEY }
            - name: APP_BASE_URL
              value: http://localhost:8080
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: appointiko
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: appointiko
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
