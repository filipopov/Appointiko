resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:Appointiko <onboarding@resend.dev>}

spring:
  datasource:
    url: jdbc:h2:mem:appointiko;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: true
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          keycloak:
            # Matches deploy/keycloak/realm-appointiko.json — local development only.
            client-secret: ${KEYCLOAK_CLIENT_SECRET:appointiko-dev-secret}

app:
  storage:
    # Matches the MinIO root credentials in docker-compose.yml — local development only.
    access-key: ${STORAGE_ACCESS_KEY:appointiko}
    secret-key: ${STORAGE_SECRET_KEY:appointiko-dev-secret}
