resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:Appointiko <onboarding@resend.dev>}

spring:
  datasource:
    url: jdbc:h2:mem:appointiko;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: true
  flyway:
    locations: classpath:db/migration
