resend:
  api-key: ${RESEND_API_KEY}
  from: ${RESEND_FROM:Appointiko <onboarding@resend.dev>}

spring:
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    show-sql: false
  flyway:
    locations: classpath:db/migration
